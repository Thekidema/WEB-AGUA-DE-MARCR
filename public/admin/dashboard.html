<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel · Agua de Mar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <h1>Agua de Mar · Panel</h1>
    <button type="button" class="btn btn-ghost" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <div id="whoami" class="admin-sub" style="margin:0"></div>
      <button type="button" class="btn btn-solid" id="newProductBtn">+ Agregar producto</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th></th>
            <th>Prenda</th>
            <th>Precio</th>
            <th>Tallas</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>
      <div id="emptyState" class="admin-empty" hidden>Todavía no hay productos. Agregá el primero.</div>
    </div>
  </main>

  <div class="admin-modal-scrim" id="modalScrim">
    <div class="admin-modal">
      <div class="admin-modal-head">
        <h2 id="modalTitle">Agregar producto</h2>
        <p class="admin-modal-sub">Los cambios se publican al instante en el catálogo.</p>
      </div>
      <form id="productForm">
        <input type="hidden" name="id">

        <div class="admin-field-row">
          <div class="admin-field">
            <label for="typeSelect">Tipo</label>
            <select name="type" id="typeSelect" required></select>
          </div>
          <div class="admin-field">
            <label for="colorSelect">Color</label>
            <div class="admin-swatch-field">
              <span class="admin-swatch-dot" id="colorSwatch" aria-hidden="true"></span>
              <select name="color" id="colorSelect" required></select>
            </div>
          </div>
        </div>

        <div class="admin-field-row">
          <div class="admin-field">
            <label for="priceInput">Precio</label>
            <div class="admin-price-field">
              <span class="admin-price-currency" aria-hidden="true">₡</span>
              <input type="text" inputmode="numeric" id="priceInput" name="price" required placeholder="0" autocomplete="off">
            </div>
          </div>
          <div class="admin-field">
            <label for="toneSelect">Tono de fondo</label>
            <div class="admin-swatch-field">
              <span class="admin-swatch-dot" id="toneSwatch" aria-hidden="true"></span>
              <select name="tone" id="toneSelect" required></select>
            </div>
          </div>
        </div>

        <div class="admin-field">
          <label>Tallas disponibles</label>
          <div class="admin-sizes" id="sizesWrap"></div>
        </div>

        <div class="admin-field">
          <label for="descInput">Descripción</label>
          <textarea name="desc" id="descInput" rows="3" required placeholder="Corte, tela, caída, detalles..."></textarea>
        </div>

        <div class="admin-field">
          <label for="imageInput">Foto del producto</label>
          <div class="admin-upload">
            <img id="currentImage" class="admin-current-image" hidden alt="Foto actual">
            <div class="admin-upload-body">
              <label class="admin-upload-btn" for="imageInput">Elegir archivo</label>
              <input type="file" name="image" id="imageInput" accept="image/jpeg,image/png,image/webp" class="admin-upload-input">
              <span class="admin-upload-name" id="imageFileName">Ningún archivo elegido</span>
              <span class="admin-upload-hint">JPEG, PNG o WebP · máx. 8MB</span>
            </div>
          </div>
          <p class="admin-sub admin-field-hint" id="currentImageHint" hidden>Dejá el campo vacío para conservar la foto actual.</p>
        </div>

        <div class="admin-modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
          <button type="submit" class="btn btn-solid">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12l5 5L20 7" />
    </svg>
    <span id="toastMsg">Agregado al carrito</span>
  </div>

  <script src="/js/data.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
