<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel · Agua de Mar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <h1>Agua de Mar · Panel</h1>
    <button type="button" class="btn btn-ghost" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <div id="whoami" class="admin-sub" style="margin:0"></div>
      <button type="button" class="btn btn-solid" id="newProductBtn">+ Agregar producto</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th></th>
            <th>Prenda</th>
            <th>Precio</th>
            <th>Tallas</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>
      <div id="emptyState" class="admin-empty" hidden>Todavía no hay productos. Agregá el primero.</div>
    </div>
  </main>

  <div class="admin-modal-scrim" id="modalScrim">
    <div class="admin-modal">
      <h2 id="modalTitle">Agregar producto</h2>
      <form id="productForm">
        <input type="hidden" name="id">
        <div class="admin-field-row">
          <label>
            Tipo
            <select name="type" id="typeSelect" required></select>
          </label>
          <label>
            Color
            <select name="color" required></select>
          </label>
        </div>
        <div class="admin-field-row">
          <label>
            Precio (₡)
            <input type="number" name="price" min="1" step="1" required>
          </label>
          <label>
            Tono de fondo
            <select name="tone" id="toneSelect" required></select>
          </label>
        </div>
        <label>
          Tallas disponibles
          <div class="admin-sizes" id="sizesWrap"></div>
        </label>
        <label>
          Descripción
          <textarea name="desc" rows="3" required></textarea>
        </label>
        <label>
          Foto (JPEG, PNG o WebP, máx. 8MB)
          <input type="file" name="image" id="imageInput" accept="image/jpeg,image/png,image/webp">
        </label>
        <img id="currentImage" class="admin-current-image" hidden alt="Foto actual">
        <p class="admin-sub" id="currentImageHint" hidden style="margin:4px 0 0">Dejá el campo vacío para conservar esta foto.</p>
        <div class="admin-modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
          <button type="submit" class="btn btn-solid">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12l5 5L20 7" />
    </svg>
    <span id="toastMsg">Agregado al carrito</span>
  </div>

  <script src="/js/data.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
